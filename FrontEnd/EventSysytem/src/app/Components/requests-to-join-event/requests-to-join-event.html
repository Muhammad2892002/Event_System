<div class="container-fluid px-3">

    <!-- Filter Card -->
    <div class="card custom-card">
        <div class="card-header">
            <h4 class="mb-0">
                <i class="bi bi-funnel"></i>
                Filter Requests
            </h4>
        </div>
        <!-->-->

        <div class="card-body">
            <div class="row g-3"> <!-- added gap -->
            <form [formGroup]="requestToJoinEvent" class="row g-3">
  
  <div class="col-md-4 col-sm-6">
    <label class="form-label">Event Name</label>
    <select class="form-select" formControlName="eventId">
      <option [value]="null">Choose Event</option>
      <option [value]="1">Annual Meeting</option>
      <option [value]="2">Tech Conference</option>
    </select>
  </div>

  <div class="col-md-4 col-sm-6">
    <label class="form-label">User Name</label>
    <select class="form-select" formControlName="userId">
      <option [value]="null">Choose User</option>
      <option [value]="1">John Doe</option>
      <option [value]="2">Jane Smith</option>
    </select>
  </div>

  <div class="col-md-4 col-sm-6">
    <label class="form-label">Status</label>
    <select class="form-select" formControlName="status">
      <option [value]="null">Choose Status</option>
      <option [value]="1">Pending</option>
      <option [value]="2">Approved</option>
      <option [value]="3">Rejected</option>
    </select>
  </div>

  <div class="col-md-4 col-sm-6">
    <label class="form-label">Requested At</label>
    <input type="date" class="form-control" formControlName="createdAt">
  </div>


</form>


            </div>

            <!-- Button aligned to the right -->
            <div class="mt-3 d-flex justify-content-end">
                <button type="button" class="btn btn-outline-secondary" (click)="click()"
                    value="Search">
                    <i class="bi bi-search"></i> Search
                   
                </button>
            </div>

        </div>
    </div>

    <!-- Table Card -->
    <div class="card custom-card">
        <div class="card-header">
            <h4 class="mb-0">
             <i class="bi bi-envelope-exclamation"></i>
                All Requests
            </h4>

            <button type="button"
                class="btn btn-outline-secondary mt-2 mt-md-0">
                <i class="bi bi-plus-square"></i>
                Add Rquest
            </button>
        </div>

        <div class="card-body table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">FirstName</th>
                        <th scope="col">LastName</th>
                        <th scope="col">Email</th>
                        <th scope="col">UserName</th>
                         
                          <th scope="col">Gender</th>
                        <th scope="col">Role</th>
                          <th scope="col">IsActive</th>
                            <th scope="col">Actions</th>
                       
                    
                    </tr>
                </thead>
                <tbody>
                  <!--  @for (item of attendees |paginate:paginationConfig; track item.Id; let i = $index) {
                    <tr>
                         <td>{{$index+1}}</td>
                         <td>{{item.firstName}}</td>
                            <td>{{item.lastName}}</td>

                            <td>{{item.userName}}</td>
                            <td>{{item.genderName}}</td>
                            <td>{{item.RoleName}}</td>
                            <td>{{item.isActive ? 'Active' : 'Inactive'}}</td>
                            <td>
                                <button type="button" class="btn btn-outline-success me-2">
                                    <i class="bi bi-pencil-square"></i> 
                                </button>
                                <button type="button" class="btn btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>


                            </td>
                       

                        
                       
                    
                    </tr>
                }-->
               

                  

                 

                </tbody>

            </table>
            <pagination-controls (pageChange)="changePage($event)">
                
            </pagination-controls>
        </div>
    </div>

</div>
